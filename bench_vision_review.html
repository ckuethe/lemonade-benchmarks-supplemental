<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision Benchmark Reviewer</title>
<style>
  :root { --bg:#1a1b26;--surface:#24283b;--border:#393b57;--text:#c0caf5;--muted:#565f8e;--accent:#7aa2f7;--green:#9ece6a;--yellow:#e0af68;--red:#f7768e }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text)}

  /* toolbar */
  .toolbar{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .toolbar label{font-size:.85rem;color:var(--muted)}
  .toolbar input[type="file"]{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:.8rem;color:var(--text);cursor:pointer}

  /* thumbnail ribbon */
  .thumb-ribbon{position:sticky;top:52px;z-index:90;overflow-x:auto;background:#1a1b26;border-bottom:1px solid var(--border);padding:8px 16px;display:flex;gap:8px}
  .thumb-card{flex-shrink:0;width:72px;height:64px;border-radius:6px;border:2px solid transparent;background-size:cover;background-position:center;cursor:pointer;position:relative;display:flex;align-items:flex-end;justify-content:center}
  .thumb-card:hover{border-color:#7aa2f7;transform:scale(1.05)}
  .thumb-card.active{border-color:var(--accent);box-shadow:0 0 8px rgba(122,162,247,.3)}
  .thumb-label{background:rgba(26,27,38,.9);color:#c0caf5;font-size:.55rem;padding:1px 3px;border-radius:2px;white-space:nowrap;text-align:center;width:100%}

  /* scenario panel */
  #scenario-panel{padding:24px 32px;min-height:60vh}
  .panel-header{display:flex;gap:20px;align-items:flex-start;margin-bottom:16px}
  .source-image-container img{max-width:380px;max-height:320px;border-radius:8px;display:block;background:#12131c;object-fit:contain}
  .panel-info{flex:1;min-width:0}
  .scenario-name{font-size:1.1rem;font-weight:600;color:var(--accent);margin-bottom:4px}
  .scenario-category{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .prompt-box{padding:10px 14px;background:#1a1b26;border-radius:6px;font-size:.82rem;color:#565f8e;border-left:3px solid var(--accent);white-space:pre-wrap;word-break:break-word;margin-bottom:16px}
  .rated-badge{font-size:.7em;color:var(--muted)}

  /* results */
  .results-grid{display:grid;gap:8px}
  .result-row{display:grid;grid-template-columns:minmax(200px,340px) minmax(0,1fr);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  @media(max-width:900px){.result-row{grid-template-columns:1fr}}

  .result-labels{background:rgba(122,162,247,.08);padding:10px 14px;font-size:.8rem;display:flex;flex-direction:column;gap:2px}
  .model-name{font-weight:600;color:#7aa2f7;font-size:.95rem;margin-bottom:2px}
  .meta-row{display:flex;gap:6px;flex-wrap:wrap}
  .meta-tag{background:rgba(122,162,247,.1);color:#7aa2f7;padding:1px 6px;border-radius:3px;font-size:.7rem;white-space:nowrap}

  .result-response{padding:10px 14px;background:var(--bg);font-size:.85rem;line-height:1.65;overflow-y:auto;max-height:360px;white-space:pre-wrap;word-break:break-word;scrollbar-width:thin}
  .result-response.error{color:#f7768e;font-style:italic}

  /* metrics row */
  .metrics-row{display:flex;gap:12px;margin-top:4px;font-size:.7rem;color:var(--muted);flex-wrap:wrap}

  /* scoring select */
  #scenario-panel select[data-card]{margin-top:6px;padding:3px 8px;background:#24283b;color:#c0caf5;border:1px solid var(--border);border-radius:4px;font-size:.75rem;text-align:center;cursor:pointer}

  /* verdict badge */
  .verdict-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:.7rem;font-weight:600;text-transform:uppercase;margin-left:auto}
  .lb-winning,.score-pass{color:var(--green)}
  .lb-good,.score-good{color:var(--accent)}
  .lb-bad,.score-bad{color:var(--yellow)}
  .lb-fail,.score-fail{color:var(--red)}

  /* summary table */
  #summary-section details{margin-top:24px;border-bottom:1px solid var(--border);padding-top:8px}
  #summary-section summary{cursor:pointer;user-select:none;font-size:.9rem;color:#7aa2f7;margin-bottom:6px;padding:4px 0}
  .table-wrap{overflow-x:auto;padding:4px 0 16px}
  table.summary{border-collapse:collapse;width:100%;min-width:640px;font-size:.8rem}
  th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:top}
  th:first-child,td:first-child{position:sticky;left:0;background:#1a1b26;z-index:2;font-weight:600;min-width:140px}
  th{color:#565f8e;font-weight:500;background:#1a1b26;z-index:1}

  /* buttons */
  .btn{padding:3px 10px;font-size:.72rem;border:1px solid var(--border);background:#24283b;color:#c0caf5;border-radius:4px;cursor:pointer}
  .btn:hover{background:#393b57}.btn.danger{color:#f7768e;border-color:#f7768e}

  /* empty state */
  #scenario-panel:empty::before{content:'Click a thumbnail above to begin';color:#565f8e;font-size:.9rem;display:block;padding:40px;text-align:center}
</style>
</head>
<body>

<div class="toolbar">
  <label for="scenarios-file">Scenarios JSON:</label><input type="file" id="scenarios-file" accept=".json">
  <label for="results-file">Results JSONL/NDJSON:</label><input type="file" id="results-file" accept=".jsonl,.ndjson,.txt">
  <span style="color:var(--border)">│</span>
  <button class="btn" onclick="exportLeaderboardHtml()">Export Leaderboard</button>
  <input type="file" id="import-input" accept=".json,.bench_backup.json" style="display:none">
  <button class="btn" onclick="backupScores()">Backup State</button>
  <button class="btn" onclick="document.getElementById('import-input').click()">Restore State</button>
  <span id="storage-info"></span>
  <button class="btn danger" onclick="resetAll()">Reset All</button>
</div>

<div class="thumb-ribbon hidden" id="thumb-ribbon"></div>

<main id="scenario-panel">
  <p style="text-align:center;padding:60px;color:#565f8e;font-size:.9rem;border-bottom:1px dashed var(--border)">Load a scenarios file and results file to begin reviewing.</p>
</main>

<details id="summary-section" class="hidden"><summary style="padding:10px 24px;">Summary Table (click to expand)</summary><div class="table-wrap"><table class="summary" id="summary-tbl"></table></div></details>


<script type="application/json" id="data-scenarios">{SCENARIOS_JSON}</script>
<script type="application/json" id="data-imgmap">{IMG_MAP_JSON}</script>
<script type="application/json" id="data-results">{RESULTS_JSON}</script>

  <script src="reviewer.js"></script>
</body>
</html>
